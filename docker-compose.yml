services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patient_registration
      POSTGRES_USER: patient_app
      POSTGRES_PASSWORD: patient_app_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_app -d patient_registration"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://patient_app:patient_app_local@db:5432/patient_registration
      VAPI_WEBHOOK_SECRET: local-development-secret
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

